name: Deployment smoke test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python for deterministic publication build
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Verify deployed-object publication for the tracked schema
        run: |
          if PYTHONPATH=src python -c 'import sqlite3,sys; sys.exit(sqlite3.connect("data/generated/rules.db").execute("PRAGMA user_version").fetchone()[0] not in (10,11))'; then
            echo "Embedded deployed objects require no legacy JSON publication."
          else
            PYTHONPATH=src python -m tools.build_deployed_object_publication
            PYTHONPATH=src python -m tools.build_deployed_object_publication --check
          fi
          PYTHONPATH=src python - <<'PY'
          import sqlite3
          from pathlib import Path

          from infinity_db.deployed_object_publication import load_deployed_object_publication
          from infinity_db.rules_database import RulesDatabase

          army = Path("data/generated/infinity.db")
          rules_path = Path("data/generated/rules.db")
          rules = RulesDatabase(rules_path)
          rules.validate()
          restrictions = rules.restrictions_payload()
          assert restrictions["available"] and len(restrictions["items"]) == 14
          assert restrictions["evaluationSupported"] is False
          schema = sqlite3.connect(rules_path).execute("PRAGMA user_version").fetchone()[0]
          paired = (rules.deployed_objects_payload(army) if schema in (10,11)
              else load_deployed_object_publication(
                  Path("data/generated/deployed-objects.json"), army, rules_path))
          assert paired is not None and len(paired["objects"]) == 17
          assert len(paired["unresolvedDeliveries"]) == 1
          PY

      - name: Validate pinned exact-variant release publication
        run: PYTHONPATH=src python -m tools.verify_deployment_assets --skip-svg

      - name: Prepare immutable runtime bundle
        run: PYTHONPATH=src python -m tools.prepare_runtime_bundle

      - name: Build application image from tracked databases and generated publication
        run: docker build --tag infinity-db:deployment-smoke .

      - name: Validate image and production startup
        run: sh scripts/verify-container-image.sh infinity-db:deployment-smoke --published-assets


