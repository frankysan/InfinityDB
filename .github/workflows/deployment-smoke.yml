name: Deployment smoke test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python for deterministic publication build
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Verify embedded deployed objects in the tracked database set
        run: |
          PYTHONPATH=src python - <<'PY'
          from pathlib import Path

          from infinity_db.database_set import validate_database_set
          from infinity_db.rules_database import RulesDatabase

          report = validate_database_set(Path("data/generated"), require_complete=True)
          assert report["deployedObjects"] == 17
          assert report["unresolvedDeliveries"] == 1
          rules_path = Path("data/generated/rules_n5.db")
          rules = RulesDatabase(rules_path)
          rules.validate()
          restrictions = rules.restrictions_payload()
          assert restrictions["available"] and len(restrictions["items"]) == 14
          assert restrictions["evaluationSupported"] is False
          PY

      - name: Validate pinned exact-variant release publication
        run: PYTHONPATH=src python -m tools.verify_deployment_assets --skip-svg

      - name: Build application image from verified tracked databases
        run: docker build --tag infinity-db:deployment-smoke .

      - name: Validate image and production startup
        run: sh scripts/verify-container-image.sh infinity-db:deployment-smoke --published-assets


