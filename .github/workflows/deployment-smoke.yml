name: Deployment smoke test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install database build CLI
        run: python -m pip install -e .

      - name: Build deployment fixture databases
        run: |
          infinity-db build tests/fixtures/deployment-smoke --output-dir data/generated --compact
          infinity-db build-rules --output data/generated/rules.db

      - name: Build redistributable application image
        run: docker build --tag infinity-db:deployment-smoke .

      - name: Validate image and production startup
        run: sh scripts/verify-container-image.sh infinity-db:deployment-smoke --redistributable
