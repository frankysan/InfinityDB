name: Source checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            check_args: "--all"
            test_workers: "auto"
          - os: windows-latest
            python: "3.11"
            check_args: "--stage test --stage build --stage rules"
            test_workers: "0"
          - os: macos-latest
            python: "3.11"
            check_args: "--stage test --stage build --stage rules"
            test_workers: "auto"
          - os: ubuntu-latest
            python: "3.14"
            check_args: "--stage test --stage build --stage rules"
            test_workers: "auto"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: python -m pip install -e ".[dev,symbols]"

      - name: Verify symbol Python dependencies
        run: python -c "import cssselect2, fontTools.ttLib, PIL.Image, tinycss2"

      - name: Run source checks
        run: >-
          python tools/run_checks.py ${{ matrix.check_args }}
          --test-workers ${{ matrix.test_workers }}
          --assets required --build-source tests/fixtures/deployment-smoke
