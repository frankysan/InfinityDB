name: Source checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      backlog_base:
        description: Optional first-parent SHA for complete V1S closeout audit
        required: false
        type: string

permissions:
  contents: read

jobs:
  source-checks:
    name: ${{ matrix.os }} / Python ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11.9"
            label: "3.11"
            check_args: "--all"
            test_workers: "auto"
            determinism: true
            timeout_minutes: 30
          - os: windows-latest
            python: "3.11.9"
            label: "3.11"
            check_args: "--stage test --stage build --stage rules"
            test_workers: "2"
            determinism: true
            timeout_minutes: 30
          - os: macos-latest
            python: "3.11.9"
            label: "3.11"
            check_args: "--stage test --stage build --stage rules"
            test_workers: "auto"
            determinism: true
            timeout_minutes: 15
          - os: ubuntu-latest
            python: "3.14"
            label: "3.14"
            check_args: "--stage test --stage build --stage rules"
            test_workers: "auto"
            determinism: false
            timeout_minutes: 15
    runs-on: ${{ matrix.os }}
    # The full check leg includes isolated preflight; Windows has a slower filesystem.
    timeout-minutes: ${{ matrix.timeout_minutes }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          # Historical reference-evidence tests read pinned older revisions via git show.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Check V1S retirement history
        if: matrix.check_args == '--all'
        run: python -m tools.check_v1_backlog_ci

      - name: Install development dependencies
        run: python -m pip install -e ".[dev,symbols]"

      - name: Verify symbol Python dependencies
        run: python -c "import cssselect2, fontTools.ttLib, PIL.Image, tinycss2"

      - name: Set up Node.js for documentation linting
        if: matrix.check_args == '--all'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install pinned documentation lint dependencies
        if: matrix.check_args == '--all'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate source-test deployed-object publication
        # This release-paired JSON is intentionally Git-ignored. All source
        # tests must run against the same deterministic publication as the
        # deployment-smoke image rather than relying on a developer's local copy.
        run: |
          python -m tools.build_deployed_object_publication
          python -m tools.build_deployed_object_publication --check

      - name: Validate tracked exact-variant publication provenance
        run: python -m tools.verify_deployment_assets --skip-svg

      - name: Run source checks
        env:
          PYTEST_ADDOPTS: "--durations=20 -ra"
        run: >-
          python tools/run_checks.py ${{ matrix.check_args }}
          --test-workers ${{ matrix.test_workers }}
          --assets required --build-source tests/fixtures/deployment-smoke

      - name: Report deterministic-output toolchain
        if: matrix.determinism
        run: >-
          python -c "import sqlite3, sys, zlib;
          print('Python', sys.version.split()[0], 'SQLite', sqlite3.sqlite_version,
          'zlib', zlib.ZLIB_RUNTIME_VERSION)"

      - name: Build deterministic-output manifest
        if: matrix.determinism
        run: python tools/build_determinism_manifest.py --output reports/determinism-manifest.json

      - name: Upload deterministic-output manifest
        if: matrix.determinism
        uses: actions/upload-artifact@v7
        with:
          name: determinism-${{ runner.os }}
          path: reports/determinism-manifest.json
          if-no-files-found: error

  deterministic-outputs:
    name: Cross-platform deterministic outputs
    needs: source-checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.9"

      - name: Download platform manifests
        uses: actions/download-artifact@v8
        with:
          pattern: determinism-*
          path: determinism-manifests

      - name: Compare artifact hashes
        run: python tools/compare_determinism_manifests.py determinism-manifests
