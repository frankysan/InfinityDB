name: Refactor repository compatibility

on:
  push:
    branches:
      - refactor/domain-manifests
    paths:
      - .github/workflows/refactor-repository-compat.yml

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/domain-manifests

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore manifest-backed helper compatibility
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/infinity_db/database/repository.py")
          text = path.read_text(encoding="utf-8")

          old_import = """    IdentityConfig,
              IdentityConfigError,
              parse_identity_metadata,
          )"""
          new_import = """    IdentityConfig,
              IdentityConfigError,
              load_identity_config,
              parse_identity_metadata,
          )"""
          if old_import not in text:
              raise SystemExit("identity import marker not found")
          text = text.replace(old_import, new_import, 1)

          skill_marker = """def skill_merge_key(name: object) -> str | None:
          """
          skill_helper = """def canonical_skill_id(
              skill_id: int, identity_config: IdentityConfig | None = None
          ) -> int:
              \"\"\"Return the configured representative ID for a skill identity group.\"\"\"
              config = identity_config or load_identity_config()
              return config.canonical_catalog_id(\"skills\", skill_id) or skill_id


          """
          if skill_marker not in text:
              raise SystemExit("skill helper marker not found")
          text = text.replace(skill_marker, skill_helper + skill_marker, 1)

          old_groups = """def logical_unit_groups(
              rows: list[sqlite3.Row],
              memberships: dict[int, list[dict[str, Any]]],
              identity_config: IdentityConfig,
          ) -> list[dict[str, Any]]:
              \"\"\"Combine 10,000-ID duplicates and their reinforcement-only variants.\"\"\"
              groups: dict[tuple[Any, ...], dict[str, Any]] = {}
          """
          new_groups = """def logical_unit_groups(
              rows: list[sqlite3.Row],
              memberships: dict[int, list[dict[str, Any]]],
              identity_config: IdentityConfig | None = None,
          ) -> list[dict[str, Any]]:
              \"\"\"Combine 10,000-ID duplicates and their reinforcement-only variants.\"\"\"
              identity_config = identity_config or load_identity_config()
              groups: dict[tuple[Any, ...], dict[str, Any]] = {}
          """
          if old_groups not in text:
              raise SystemExit("logical-unit helper marker not found")
          text = text.replace(old_groups, new_groups, 1)

          path.write_text(text, encoding="utf-8", newline="\n")

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Run Ruff
        run: python -m ruff check src/infinity_db src/infinity_army_data/cli.py tests

      - name: Commit validated helper update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/infinity_db/database/repository.py
          git diff --cached --quiet && exit 0
          git commit -m "Restore manifest-backed repository helper compatibility"
          git push origin HEAD:refactor/domain-manifests
