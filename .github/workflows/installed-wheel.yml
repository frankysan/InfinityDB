name: Installed wheel smoke

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/wheelhouse" .

      - name: Validate installed wheel outside checkout
        run: >-
          python tools/installed_wheel_smoke.py
          --wheel "$RUNNER_TEMP"/wheelhouse/*.whl
          --work-dir "$RUNNER_TEMP/wheel-smoke"
