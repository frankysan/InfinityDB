name: Cross-browser compatibility

# Optional cross-platform browser coverage for changes that warrant it.
# The v1.0.x release contract remains preserved by its historical tags.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: ${{ matrix.os }} / ${{ matrix.engine }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            engine: chromium
          - os: ubuntu-latest
            engine: firefox
          - os: macos-latest
            engine: webkit
          - os: windows-latest
            engine: msedge
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: python -m pip install -e ".[dev,symbols]" "playwright==1.64.1"

      - name: Install selected browser and OS dependencies
        if: matrix.os == 'ubuntu-latest'
        run: python -m playwright install --with-deps ${{ matrix.engine }}

      - name: Install selected browser
        if: matrix.os != 'ubuntu-latest'
        run: python -m playwright install ${{ matrix.engine }}

      - name: Validate selected runtime database set
        # Read-only schema, integrity, source binding and embedded-content checks.
        run: python -m infinity_db database-health --db-dir data/generated

      - name: Run selected critical journeys
        run: python -m tools.run_cross_browser_compatibility --engine ${{ matrix.engine }}

      - name: Upload JUnit and failure traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cross-browser-${{ matrix.engine }}-${{ runner.os }}
          path: local/validation/project-infrastructure/cross-browser/
          if-no-files-found: warn
          retention-days: 7
