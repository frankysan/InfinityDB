<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#162323">
    <title>Unit details · InfinityDB</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script type="module" src="/static/unit.js"></script>
  </head>
  <body>
    <main id="main" class="main unit-detail" tabindex="-1">
      <header class="topbar"><a href="/">← Back to unit explorer</a></header>
      <section class="intro" aria-labelledby="unit-name">
        <div><p class="eyebrow">Unit details</p><h1 id="unit-name">Loading unit…</h1><p id="unit-meta" class="intro-copy"></p></div>
      </section>
      <p id="unit-status" role="status" aria-live="polite">Loading unit details…</p>
      <section id="unit-content" hidden></section>
    </main>
  </body>
</html>
