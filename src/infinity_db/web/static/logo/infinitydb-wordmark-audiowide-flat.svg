<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" version="1.1">
  <title>InfinityDB wordmark — Audiowide flat</title>
  <defs>
