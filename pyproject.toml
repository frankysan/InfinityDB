[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "infinity-db"
version = "0.6.1"
description = "Infinity database, data ingestion tools, and extensible web unit browser"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Johannes Haglund" }]
dependencies = []

[project.optional-dependencies]
server = [
  "gunicorn>=23.0,<24",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.12",
  "pyright[nodejs]>=1.1.414,<1.2",
]
symbols = [
  "fonttools>=4.0",
  "tinycss2>=1.4",
  "cssselect2>=0.8",
  "pillow>=10.0",
]

[project.scripts]
infinity-db = "infinity_db.cli:main"
infinity-army = "infinity_army_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.data-files]
"share/infinity-db/config/catalogs" = [
  "config/catalogs/weapon-categories.json",
  "config/catalogs/weapon-overrides.json",
]
"share/infinity-db/config/identity" = [
  "config/identity/source-identities.json",
]
"share/infinity-db/config/validation" = [
  "config/validation/source-anomalies.json",
]
"share/infinity-db/data/curated/identities" = [
  "data/curated/identities/army-display.json",
]

[tool.setuptools.package-data]
"infinity_db.web" = ["static/*.html", "static/*.css", "static/*.js", "static/*.json", "static/*.svg", "static/armies/**/*.svg", "static/characteristics/*.svg", "static/orders/*.svg", "static/units/**/*.svg"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--basetemp=.pytest-tmp", "-m", "not full_assets"]
markers = [
  "full_assets: requires the complete validated local Corvus Belli graphical asset set",
]
cache_dir = ".cache/pytest"

[tool.pyright]
include = ["src", "tools", "tests"]
extraPaths = ["src", "tools"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingTypeStubs = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# SQL clauses are intentionally kept as complete strings for easier query review.
"src/infinity_db/database/repository.py" = ["E501"]
