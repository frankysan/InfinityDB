[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "infinity-db"
version = "0.1.0"
description = "Infinity database, data ingestion tools, and extensible web unit browser"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Johannes Haglund" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.12",
]

[project.scripts]
infinity-db = "infinity_db.cli:main"
infinity-army = "infinity_army_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"infinity_db.web" = ["static/*.html", "static/*.css", "static/*.js", "static/army-symbols/**/*.svg", "static/unit-symbols/**/*.svg"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
