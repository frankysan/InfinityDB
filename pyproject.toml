[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "infinity-db"
version = "0.4.0"
description = "Infinity database, data ingestion tools, and extensible web unit browser"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Johannes Haglund" }]
dependencies = []

[project.optional-dependencies]
server = [
  "gunicorn>=23.0,<24",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.12",
]

[project.scripts]
infinity-db = "infinity_db.cli:main"
infinity-army = "infinity_army_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"infinity_db.web" = ["static/*.html", "static/*.css", "static/*.js", "static/*.svg", "static/armies/**/*.svg", "static/orders/*.svg", "static/units/**/*.svg"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# SQL clauses are intentionally kept as complete strings for easier query review.
"src/infinity_db/database/repository.py" = ["E501"]
